<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemrograman JavaScript Dasar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .demo-box {
            width: 50px;
            height: 50px;
            background-color: #667eea;
            position: relative;
            top: 0;
            left: 0;
            transition: 0.3s;
            margin: 20px 0;
            border-radius: 5px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .input-group {
            margin: 15px 0;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin: 5px;
        }
        .output {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
        }
        @media (max-width: 600px) {
            .demo-box {
                background-color: #764ba2;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pemrograman JavaScript Dasar</h1>
            <p>Eksperimen dan Contoh Kode</p>
        </header>

        <div class="card">
            <h2>1. Animasi dengan requestAnimationFrame</h2>
            <div id="box1" class="demo-box"></div>
            <button onclick="startAnimation1()">Mulai Animasi</button>
            <button onclick="resetAnimation1()">Reset</button>
        </div>

        <div class="card">
            <h2>2. Responsive Animation (Bergerak)</h2>
            <div id="box2" class="demo-box"></div>
            <button onclick="startAnimation2()">Mulai Animasi Responsif</button>
            <button onclick="resetAnimation2()">Reset</button>
        </div>

        <div class="card">
            <h2>3. Variabel dan Console Log</h2>
            <p>Lihat Console (F12 → Console) untuk melihat output!</p>
            <div class="output" id="varOutput"></div>
            <button onclick="showVariables()">Tampilkan Variabel</button>
        </div>

        <div class="card">
            <h2>4. Interaksi User</h2>
            <div class="input-group">
                <label>Masukkan nama:</label>
                <input type="text" id="nameInput" placeholder="Nama Anda">
                <button onclick="greetUser()">Sapa Saya!</button>
            </div>
            <div class="output" id="greetOutput"></div>
        </div>

        <div class="card">
            <h2>5. Hitung Angka</h2>
            <div class="input-group">
                <input type="number" id="num1" placeholder="Angka 1">
                <input type="number" id="num2" placeholder="Angka 2">
                <button onclick="calculate()">Hitung Jumlah</button>
            </div>
            <div class="output" id="calcOutput"></div>
        </div>
    </div>

    <script src="js.js"></script>
</body>
</html>
